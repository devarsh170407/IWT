<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>

<body style="background-color:skyblue;font-family:Times New Roman;">

<center>

<h1>Student Registration Form</h1>

<form>

<table cellpadding="10">

<tr>
<td>Roll no. :</td>
<td><input type="text" size="40"></td>
</tr>

<tr>
<td>Student name :</td>
<td>
<input type="text" placeholder="First Name">
-
<input type="text" placeholder="Last Name">
</td>
</tr>

<tr>
<td>Father's name :</td>
<td><input type="text" size="40"></td>
</tr>

<tr>
<td>Date of birth :</td>
<td>
<input type="text" placeholder="Day" size="5">
-
<input type="text" placeholder="Month" size="5">
-
<input type="text" placeholder="Year" size="7">
(DD-MM-YYYY)
</td>
</tr>

<tr>
<td>Mobile no. :</td>
<td>
+91 -
<input type="text" size="30">
</td>
</tr>

<tr>
<td>Email id :</td>
<td><input type="email" size="40"></td>
</tr>

<tr>
<td>Password :</td>
<td><input type="password" size="40"></td>
</tr>

<tr>
<td>Gender :</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Department :</td>
<td>
<input type="checkbox"> CSE
<input type="checkbox"> IT
<input type="checkbox"> ECE
<input type="checkbox"> Civil
<input type="checkbox"> Mech
</td>
</tr>

<tr>
<td>Course :</td>
<td>
<select>
<option>------------------ Select Current Course's ------------------</option>
<option>B.Tech</option>
<option>BCA</option>
<option>BBA</option>
<option>MCA</option>
<option>M.Tech</option>
</select>
</td>
</tr>

<tr>
<td>Student photo :</td>
<td>
<input type="file">
</td>
</tr>

<tr>
<td>City :</td>
<td><input type="text" size="40"></td>
</tr>

<tr>
<td>Address :</td>
<td>
<textarea rows="5" cols="35"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Register">
</td>
</tr>

</table>

</form>

</center>

</body>
</html>
