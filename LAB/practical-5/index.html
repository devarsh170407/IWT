<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: #333;
            color: #fff;
            padding: 15px;
            text-align: center;
        }

        nav {
            background: #555;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
        }

        nav a:hover {
            background: #ddd;
            color: black;
        }

        .slider {
            position: relative;
            max-width: 100%;
            height: 400px;
            overflow: hidden;
        }

        .slides {
            display: flex;
            width: 300%;
            animation: slide 9s infinite;
        }

        .slides img {
            width: 100%;
            height: 400px;
        }

        @keyframes slide {
            0% { margin-left: 0; }
            33% { margin-left: -100%; }
            66% { margin-left: -200%; }
            100% { margin-left: 0; }
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
        }
    </style>
</head>
<body>

    <header>
        <h1>Devarsh Bhatt</h1>
        <p>Welcome to My Website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="slider">
        <div class="slides">
            <img src="https://picsum.photos/id/1015/1200/400" alt="Slide 1">
            <img src="https://picsum.photos/id/1016/1200/400" alt="Slide 2">
            <img src="https://picsum.photos/id/1018/1200/400" alt="Slide 3">
        </div>
    </div>

    <div class="content">
        <h2>About Website</h2>
        <p>this is a homepage design with a header, navigation bar, image slider, and footer.</p>
    </div>

    <footer>
        <p>&copy; 2026 Devarsh | All Rights Reserved</p>
    </footer>

</body>
</html>
